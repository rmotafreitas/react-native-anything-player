nodeLinker: node-modules
nmHoistingLimits: workspaces

yarnPath: .yarn/releases/yarn-4.11.0.cjs

# Upstream presets use these host tools but omit their peer declarations.
# Declare the real peers so Yarn wires them from this project's pinned tools.
packageExtensions:
  "@react-native/eslint-config@*":
    peerDependencies:
      typescript: "*"
      hermes-eslint: "*"
  "@react-native/jest-preset@*":
    peerDependencies:
      "@babel/core": "*"
  "babel-plugin-transform-flow-enums@*":
    peerDependencies:
      "@babel/core": "*"
  "@algolia/autocomplete-core@*":
    peerDependencies:
      "@algolia/client-search": "^5.0.0"
      algoliasearch: "^5.0.0"
      search-insights: "^2.13.0"
  "@algolia/autocomplete-plugin-algolia-insights@*":
    peerDependencies:
      "@algolia/client-search": "^5.0.0"
      algoliasearch: "^5.0.0"
  "@docsearch/react@*":
    peerDependencies:
      "@algolia/client-search": "^5.0.0"
  "@docsearch/js@*":
    peerDependencies:
      "@algolia/client-search": "^5.0.0"
      search-insights: "^2.13.0"
  "vitepress@*":
    peerDependencies:
      "@algolia/client-search": "^5.0.0"
      search-insights: "^2.13.0"
