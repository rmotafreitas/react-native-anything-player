<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RNAP on the web</title>
    <!--
      The plain-web build: no React, no bundler. In an app, import from the
      package (`react-native-anything-player/web`) or a CDN such as esm.sh;
      this import map points the same specifier at the local build.
    -->
    <script type="importmap">
      { "imports": { "react-native-anything-player/web": "/lib/module/web/index.js" } }
    </script>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #2b1712; background: #fff8f2; }
      h1 { font-size: 1.4rem; }
      button { font: inherit; margin: 0 .4rem .4rem 0; padding: .35rem .8rem; border: 1px solid #c8613d; border-radius: .5rem; background: #fff; cursor: pointer; }
      button[aria-pressed='true'] { background: #c8613d; color: #fff; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem 1rem; }
      dt { font-weight: 600; }
      canvas { width: 100%; height: 64px; background: #2b1712; border-radius: .5rem; }
      form { display: flex; gap: .4rem; margin: 0 0 .6rem; }
      input[type='search'] { flex: 1; font: inherit; padding: .35rem .6rem; border: 1px solid #c8613d; border-radius: .5rem; }
      [hidden] { display: none !important; }
      #drop { display: block; margin: 0 0 .8rem; padding: .6rem .8rem; border: 2px dashed #c8613d; border-radius: .5rem; }
      #drop[data-over='true'] { background: #fde7da; }
      #file-name { display: block; font-size: 13px; color: #7a5a4e; }
      #log { max-height: 12rem; overflow: auto; font: 12px/1.4 ui-monospace, monospace; background: #fff; padding: .5rem; border-radius: .5rem; }
    </style>
  </head>
  <body>
    <h1>React Native Anything Player, in a plain web page</h1>
    <p>Start the test radio (<code>node scripts/stream-server/server.mjs</code>), pick a source, then press Play.</p>
    <div id="stations"></div>
    <label id="drop">
      Drop an audio file here, or pick one:
      <input id="file" type="file" accept="audio/*" />
      <span id="file-name">–</span>
    </label>
    <p>
      <button id="toggle">Play</button>
      <button id="stop">Stop</button>
      <button id="visualizer" aria-pressed="false">Visualizer</button>
    </p>
    <p>
      <button id="route" hidden>Output…</button>
      <button id="cast" hidden>Cast</button>
    </p>
    <form id="search" role="search">
      <input id="query" type="search" placeholder="Play something: “test radio”, “a tone”…" aria-label="Search the catalog" />
      <button type="submit" id="search-go">Search</button>
      <button type="button" id="mic" aria-label="Speak" hidden>🎤</button>
    </form>
    <dl>
      <dt>State</dt><dd id="state">idle</dd>
      <dt>Output</dt><dd id="output">–</dd>
      <dt>Cast</dt><dd id="cast-state">–</dd>
      <dt>Search</dt><dd id="search-result">–</dd>
      <dt>Now playing</dt><dd id="now">–</dd>
      <dt>Station</dt><dd id="station">–</dd>
      <dt>Position</dt><dd id="position">–</dd>
      <dt>Behind live</dt><dd id="live">–</dd>
      <dt>Last error</dt><dd id="error">–</dd>
    </dl>
    <canvas id="scope" width="600" height="64"></canvas>
    <h2>Events</h2>
    <pre id="log"></pre>
    <!-- hls.js, for HLS outside Safari: the copy in node_modules (served by serve.mjs). -->
    <script src="/vendor/hls.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
