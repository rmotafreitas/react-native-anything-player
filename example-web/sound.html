<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RNAP Sound on the web</title>
    <!-- The plain-web build: the import map points the package specifier at the local build. -->
    <script type="importmap">
      {
        "imports": {
          "react-native-anything-player/sound": "/lib/module/sound/web.js",
          "react-native-anything-player/web": "/lib/module/web/index.js"
        }
      }
    </script>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #2b1712; background: #fff8f2; }
      button { font: inherit; margin: 0 .4rem .4rem 0; padding: .35rem .8rem; border: 1px solid #c8613d; border-radius: .5rem; background: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Sound effects in a plain web page</h1>
    <p>A tone is generated in the page and loaded as a sound. Each press plays another copy, panned at random.</p>
    <p>
      <button id="load">Load</button>
      <button id="play">Play</button>
      <button id="stop">Stop all</button>
    </p>
    <pre id="log"></pre>
    <script type="module" src="./sound.js"></script>
  </body>
</html>
