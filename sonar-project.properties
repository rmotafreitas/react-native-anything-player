# Jenkinsfile.sonar supplies the host URL and token at runtime.
sonar.projectKey=rmotafreitas_react-native-anything-player
sonar.projectName=react-native-anything-player
sonar.sourceEncoding=UTF-8
sonar.sources=src,android/src/main,ios
sonar.tests=src,android/src/test,ios/Tests
sonar.test.inclusions=src/**/__tests__/**,android/src/test/**,ios/Tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/build/**,**/.build/**,**/generated/**,ios/Tests/**,ios/Package.swift,src/**/__tests__/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
# The JS coverage gate excludes generated TurboModule declarations. Native
# conformance tests run separately; JS LCOV cannot measure Swift/Kotlin coverage.
sonar.coverage.exclusions=src/native/**,android/**,ios/**
# RoutingDriver forwards to a target that changes on every output switch, so
# Kotlin `by` delegation (S6514), which binds one delegate for good, cannot apply.
sonar.issue.ignore.multicriteria=routing,jitter
sonar.issue.ignore.multicriteria.routing.ruleKey=kotlin:S6514
sonar.issue.ignore.multicriteria.routing.resourceKey=android/src/main/java/com/anythingplayer/platform/RoutingDriver.kt
# The engine's random number only spreads reconnect delays (backoff jitter);
# nothing secret depends on it (S2245).
sonar.issue.ignore.multicriteria.jitter.ruleKey=kotlin:S2245
sonar.issue.ignore.multicriteria.jitter.resourceKey=android/src/main/java/com/anythingplayer/core/PlaybackEngine.kt
