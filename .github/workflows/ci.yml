name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_pods:
        description: Regenerate the example CocoaPods lockfile for a reviewed native dependency change
        type: boolean
        default: false
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Quality gates and build
        run: yarn check:ci
      - name: Publish reusable results
        run: node scripts/ci-results.mjs publish rmotafreitas/react-native-anything-player
      - name: Upload reusable results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results
          path: ci-results.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports
          path: |
            coverage/
            junit.xml
          if-no-files-found: warn

  test-engine-ios:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift engine conformance + ICY tests
        run: cd ios && swift test

  test-engine-android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Gradle caches and wrapper validation
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Android lint and Kotlin engine conformance + ICY tests
        run: cd example/android && ./gradlew :react-native-anything-player:lintDebug :react-native-anything-player:testDebugUnitTest --no-daemon --build-cache
      - name: Android lint and tests with Cast, Sound and Android Auto built in
        run: cd example/android && ./gradlew :react-native-anything-player:lintDebug :react-native-anything-player:testDebugUnitTest -PrnapCast=true -PrnapSound=true -PrnapCar=true -PrnapVideo=true --no-daemon --build-cache

  build-android:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: v2-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-turborepo-android-${{ hashFiles('yarn.lock', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-turborepo-android-${{ hashFiles('yarn.lock', '.nvmrc') }}-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Set up Gradle caches and wrapper validation
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # The Cast SDKs are opt-in (`rnapCast`): build with them linked too, so
      # neither configuration breaks. Skipped when turbo already proved the
      # sources unchanged.
      - name: Build example for Android with Google Cast, Sound, Android Auto and video
        if: env.turbo_cache_hit != 1
        working-directory: example/android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          ./gradlew assembleDebug -PrnapCast=true -PrnapSound=true -PrnapCar=true -PrnapVideo=true -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain

  build-ios:
    timeout-minutes: 60
    runs-on: macos-latest
    name: build-ios (cast ${{ matrix.cast }})

    strategy:
      fail-fast: false
      matrix:
        # Google Cast and CarPlay are opt-in at `pod install` (RNAP_CAST=1,
        # RNAP_CAR=1): build both configurations, the "on" leg with both.
        cast: ['off', 'on']

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios-cast-${{ matrix.cast }}
      RNAP_CAST: ${{ matrix.cast == 'on' && '1' || '0' }}
      # The Sound API and CarPlay are opt-in too: built in the same leg as Cast.
      RNAP_SOUND: ${{ matrix.cast == 'on' && '1' || '0' }}
      RNAP_CAR: ${{ matrix.cast == 'on' && '1' || '0' }}
      RNAP_VIDEO: ${{ matrix.cast == 'on' && '1' || '0' }}
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Record native toolchain
        run: echo "CI_NATIVE_TOOLCHAIN=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: v2-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-turborepo-ios-cast-${{ matrix.cast }}-${{ hashFiles('yarn.lock', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-turborepo-ios-cast-${{ matrix.cast }}-${{ hashFiles('yarn.lock', '.nvmrc') }}-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Set up Ruby
        id: ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: '3.3'

      # The bundle's native extensions are built against one Ruby: its exact
      # install (3.3.12, 3.3.13…) is in the key, so a patch release starts a
      # new bundle instead of loading one that cannot link.
      - name: Cache CocoaPods and Ruby downloads
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/.cache/animu-bundle
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-pods-${{ steps.ruby.outputs.ruby-prefix }}-cast-${{ matrix.cast }}-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile', 'example/Gemfile.lock', '*.podspec', 'yarn.lock') }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        env:
          UPDATE_PODS: ${{ inputs.update_pods == true }}
        run: |
          cd example
          bundle config set path "$HOME/.cache/animu-bundle"
          bundle install
          if [ "$UPDATE_PODS" = true ]; then
            bundle exec pod update --project-directory=ios --no-repo-update
          else
            bundle exec pod install --project-directory=ios || bundle exec pod install --project-directory=ios --repo-update
          fi
          if [ "$RNAP_CAST" = 1 ]; then
            grep -A1 -- "- google-cast-sdk" ios/Podfile.lock || { echo "google-cast-sdk was not installed"; exit 1; }
          fi

      - name: Export regenerated CocoaPods lockfile for review
        if: inputs.update_pods == true && matrix.cast == 'off'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: example-podfile-lock
          path: example/ios/Podfile.lock
          if-no-files-found: error

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # `react-native build-ios` re-runs `pod install` itself: make sure it kept the flag.
      - name: Verify the Google Cast flag reached the build
        if: env.turbo_cache_hit != 1
        run: |
          if grep -q "CastDriver.swift" example/ios/Pods/Pods.xcodeproj/project.pbxproj; then compiled=1; else compiled=0; fi
          if [ "$RNAP_CAST" = 1 ] && [ "$compiled" != 1 ]; then echo "Cast sources missing from the Pods project"; exit 1; fi
          if [ "$RNAP_CAST" != 1 ] && [ "$compiled" = 1 ]; then echo "Cast sources present with RNAP_CAST off"; exit 1; fi
          echo "Cast compiled: $compiled"
          if grep -q "RNAPCarPlay.swift" example/ios/Pods/Pods.xcodeproj/project.pbxproj; then car=1; else car=0; fi
          if [ "$RNAP_CAR" = 1 ] && [ "$car" != 1 ]; then echo "CarPlay sources missing from the Pods project"; exit 1; fi
          if [ "$RNAP_CAR" != 1 ] && [ "$car" = 1 ]; then echo "CarPlay sources present with RNAP_CAR off"; exit 1; fi
          echo "CarPlay compiled: $car"
          if grep -q "VideoOutput.swift" example/ios/Pods/Pods.xcodeproj/project.pbxproj; then video=1; else video=0; fi
          if [ "$RNAP_VIDEO" = 1 ] && [ "$video" != 1 ]; then echo "Video sources missing from the Pods project"; exit 1; fi
          if [ "$RNAP_VIDEO" != 1 ] && [ "$video" = 1 ]; then echo "Video sources present with RNAP_VIDEO off"; exit 1; fi
          echo "Video compiled: $video"


  build-docs:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "last updated" dates come from git history

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the docs site
        run: yarn docs:build

  e2e-web:
    # The web engine in real browsers (Chromium, Firefox, WebKit) against the
    # local test radio: the plain-web example and the Expo example's web
    # export, which runs the native integration scenarios.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The media is deterministic: generated (apt + ffmpeg) only when the
      # script changes, and saved at once, so a run that times out later still
      # leaves it for the next one. A slow apt mirror took 23 of the job's 30
      # minutes installing ffmpeg with its recommended packages.
      - name: Restore the test radio's media
        id: test-media
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/stream-server/media
          key: test-media-${{ hashFiles('scripts/stream-server/generate-media.sh') }}
      - name: Generate the test radio's media
        if: steps.test-media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          bash scripts/stream-server/generate-media.sh
      - name: Save the test radio's media
        if: steps.test-media.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/stream-server/media
          key: ${{ steps.test-media.outputs.cache-primary-key }}
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-expo-npm-${{ hashFiles('example-expo/package-lock.json') }}
          restore-keys: ${{ runner.os }}-expo-npm-
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Give the browsers an audio output
        # The runner has no sound device; without one, Firefox never starts
        # playback. A PulseAudio null sink plays into nothing.
        run: |
          sudo apt-get install -y -q pulseaudio
          pulseaudio -D -n --exit-idle-time=-1 -L module-native-protocol-unix -L "module-null-sink sink_name=ci" -L module-always-sink
          pactl info | grep 'Default Sink'
      - name: Build and run the end-to-end suite
        run: yarn test:web
      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-web-traces
          path: e2e/test-results/
          if-no-files-found: ignore

  audit-expo-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build the current library package
        run: yarn prepare && yarn pack --out example-expo/react-native-anything-player.tgz
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-expo-npm-${{ hashFiles('example-expo/package-lock.json') }}
          restore-keys: ${{ runner.os }}-expo-npm-
      - name: Install and verify example security patches
        working-directory: example-expo
        run: npm ci && npx tsc --noEmit && npx expo install --check && node ../scripts/check-expo-audit.mjs

  audit-ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: '3.3'
          working-directory: example
          bundler-cache: true
      - name: Audit all locked Ruby dependencies
        working-directory: example
        run: bundle exec bundler-audit check --update
