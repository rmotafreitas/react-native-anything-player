buildscript {
  ext.AnythingPlayer = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    // Media3 is the only runtime dependency. Apps can pin another 1.x via
    // `rnapMedia3Version` in their root `ext` (e.g. to share a version with
    // another library).
    media3Version: "1.11.1",
    // The system Output Switcher dialog for Android 11–13 (a few hundred KB).
    mediaRouterVersion: "1.8.1",
    // Only with `rnapCast=true`: the Cast sender framework media3-cast builds on.
    castFrameworkVersion: "22.3.1",
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }
    return AnythingPlayer[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def media3Version = rootProject.ext.has("rnapMedia3Version") ? rootProject.ext.get("rnapMedia3Version") : AnythingPlayer.media3Version
def mediaRouterVersion = AnythingPlayer.mediaRouterVersion
// Google Cast is opt-in (1.4 MB more in an R8-shrunk APK, 7 MB without R8;
// benchmarks/results/apk.json): `rnapCast=true` in
// gradle.properties (or -PrnapCast=true, or `rnapCast` in the root `ext`).
// Off, `src/nocast` stubs report `unavailable` and no Cast SDK is linked.
def includeCast = ["rnapCast"].any { name ->
  def value = project.hasProperty(name) ? project.property(name) : (rootProject.ext.has(name) ? rootProject.ext.get(name) : null)
  value != null && value.toString() == "true"
}
// The Sound API (`react-native-anything-player/sound`) is opt-in too: one
// shared SoundPool, no extra library. `rnapSound=true` in gradle.properties
// (or -PrnapSound=true, or `rnapSound` in the root `ext`). Off, `src/nosound`
// stubs report `unavailable` and `Sound.load()` rejects with SOUND_UNAVAILABLE.
def includeSound = ["rnapSound"].any { name ->
  def value = project.hasProperty(name) ? project.property(name) : (rootProject.ext.has(name) ? rootProject.ext.get(name) : null)
  value != null && value.toString() == "true"
}
// Video players (`new Player({ video })`, `<VideoView>`) are opt-in too: tens
// of KB of views and glue, no extra library (ExoPlayer plays video already).
// `rnapVideo=true` in gradle.properties (or -PrnapVideo=true, or `rnapVideo`
// in the root `ext`). Off, `src/novideo` stubs make `new Player({ video })`
// throw VIDEO_UNAVAILABLE and `<VideoView>` an empty box.
def includeVideo = ["rnapVideo"].any { name ->
  def value = project.hasProperty(name) ? project.property(name) : (rootProject.ext.has(name) ? rootProject.ext.get(name) : null)
  value != null && value.toString() == "true"
}
// DASH (`.mpd`, Media3's DASH module): built in with video unless
// `rnapDash=false`, and into an audio-only app with `rnapDash=true`.
def dashProperty = project.hasProperty("rnapDash") ? project.property("rnapDash") : (rootProject.ext.has("rnapDash") ? rootProject.ext.get("rnapDash") : null)
def includeDash = dashProperty != null ? dashProperty.toString() == "true" : includeVideo
// Android Auto is opt-in: `rnapCar=true` (or -PrnapCar=true, or `rnapCar` in
// the root `ext`) declares the app a media app for Android Auto. The browse
// tree itself (Wear OS, Android Automotive OS, Assistant) needs no flag.
def includeCar = ["rnapCar"].any { name ->
  def value = project.hasProperty(name) ? project.property(name) : (rootProject.ext.has(name) ? rootProject.ext.get(name) : null)
  value != null && value.toString() == "true"
}
// HLS is on by default (many stations and podcasts are HLS-only). Apps that
// only play progressive streams can drop it with `rnapHls=false` in
// gradle.properties (64 KB in an R8-shrunk APK, 96 KB without R8).
def includeHls = !project.hasProperty("rnapHls") || project.property("rnapHls") != "false"

android {
  namespace "com.anythingplayer"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    consumerProguardFiles "proguard-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main.java.srcDirs += includeCast ? "src/cast/java" : "src/nocast/java"
    main.java.srcDirs += includeSound ? "src/sound/java" : "src/nosound/java"
    main.java.srcDirs += includeVideo ? "src/video/java" : "src/novideo/java"
    // Cast's options provider and Output Switcher receiver, and Android Auto's
    // meta-data, are declared only when built in: merged on top of the main
    // manifest. A source set holds one manifest, so both together have their own.
    def overlay = includeCast && includeCar ? "src/castcar/AndroidManifest.xml" : includeCast ? "src/cast/AndroidManifest.xml" : includeCar ? "src/car/AndroidManifest.xml" : null
    if (overlay != null) {
      debug.manifest.srcFile overlay
      release.manifest.srcFile overlay
    }
    if (includeCar) main.res.srcDirs += "src/car/res"
  }

  testOptions {
    unitTests.all {
      testLogging {
        events "failed"
        exceptionFormat "full"
        showStandardStreams true
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.media3:media3-exoplayer:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
  // HTTP through OkHttp (already in every React Native app): a call can be
  // cancelled from any thread, which closes even a socket blocked in a read.
  implementation "androidx.media3:media3-datasource-okhttp:$media3Version"
  // The output picker: SystemOutputSwitcherDialogController where MediaRouter2's
  // own switcher (Android 14+) is not there.
  implementation "androidx.mediarouter:mediarouter:$mediaRouterVersion"
  if (includeHls) {
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
  }
  if (includeDash) {
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
  }

  if (includeCast) {
    implementation "androidx.media3:media3-cast:$media3Version"
    implementation "com.google.android.gms:play-services-cast-framework:${AnythingPlayer.castFrameworkVersion}"
  }

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
}

// The shared engine spec lives outside this module: make it a test input so a
// change to a scenario re-runs the Kotlin conformance tests.
tasks.withType(Test).configureEach {
  def spec = file("${projectDir}/../conformance")
  if (spec.exists()) inputs.dir(spec).withPropertyName("conformanceSpec")
}
